<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subjugated Dialectics — Play</title>
<meta name="description" content="Redesigned standalone Play page for Subjugated Dialectics (engine77). Offline, no network calls.">
<style>:root{--bg:#0f1113;--card:#181b1e;--panel:#202428;--line:#2e3439;--text:#ece6d8;--muted:#9aa3ab;--amber:#f0b040;--amber-d:#e0a030;--rust:#c8553a;--steel:#8fa5b8;--ok:#7fbf8a;

.menu-item{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;text-align:left;gap:2px 16px;padding:16px 20px;min-height:72px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit;transition:border-color .15s,transform .15s,background .15s}

.r-art{position:sticky;top:16px}.art{width:100%;aspect-ratio:1;display:block;border-radius:16px}

.dilemma p{color:var(--amber);font-weight:600}.muted{color:var(--muted);font-size:14px}.small{font-size:12px}
.code{display:block;word-break:break-all;background:#121416;padding:8px 10px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.note{color:var(--steel)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.g-cell{display:flex;flex-direction:column;gap:6px}.thumb{width:100%;aspect-ratio:1;border-radius:12px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (max-width:560px){.card{padding:18px}.lens-row{grid-template-columns:1fr 1fr 1fr}.lens-t{grid-column:1/-1}}

tput": 0.9, "control": 0.3, "cost": 0.5}, {"name": "BOOST THE LOYAL FEED", "text": "What is agreed with rises. What is doubted sinks quietly.", "order": 0.9, "output": 0.1, "control": 0.5, "cost": 0.6}, {"name": "FLAG THE DISSENTERS", "text": "A badge for the doubters. Visibility as a leash.", "order": 0.5, "output": 0.2, "control": 0.9, "cost": 0.8}, {"name": "GRANT VERIFIED STATUS", "text": "Trust, sold at a discount to the compliant.", "order": 0.2, "output": 0.4, "control": 0.1, "cost": 0.1}], "closing": {"synthesis": "A shared claim survived being questioned. Rare, and fragile.", "no_synthesis": "Every side kept its facts. Nothing joined them."}}};</script>
<script>// Port of Subjugated Dialectics play logic (DialecticSim → LensSim → NodeSim v0.1 → V2 → V3 → V4)
// from the decompiled Godot 4.7.2 source. RNG = Godot RandomPCG (PCG32) incl. float32 randf_range.
const SD = (() => {
const M64 = (1n << 64n) - 1n, MUL = 6364136223846793005n, INC_DEFAULT = 1442695040888963407n;
const f = Math.fround;
class PCG {
  constructor(seed) { this.seed = seed; this.inc = ((INC_DEFAULT << 1n) | 1n) & M64; this.state = 0n; this.next(); this.state = (this.state + (BigInt(seed) & M64)) & M64; this.next(); }
  next() { const old = this.state; this.state = (old * MUL + this.inc) & M64;
    const xs = Number((((old >> 18n) ^ old) >> 27n) & 0xffffffffn); const rot = Number(old >> 59n);
    return ((xs >>> rot) | (xs << ((-rot) & 31))) >>> 0; }
  randf() { const p = this.next(); if (p === 0) return 0; const sig = (this.next() | 0x80000001) >>> 0;
    return f(f(sig) * Math.pow(2, -32 - Math.clz32(p))); }
  range(a, b) { a = f(a); b = f(b); return f(f(this.randf() * f(b - a)) + a); }
}
const OBEY='obey', NEGOTIATE='negotiate', DEFY='defy';
const BALANCE_BAND=0.15, BALANCE_HOLD=4;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const Grid={CELLS:20,CELL_PCT:5,BAND_LO:45,BAND_HI:55,BAND_HALF:0.1,
  gauge:g=>(g+1)*50, cell:g=>clamp(Math.floor(((g+1)*50)/5),0,19), inBand:g=>Math.abs(g)<0.1};
const FRAGMENTS={system:['order','output','control'],persona:['autonomy','belonging','purpose']};
const CODES={'system:order':'O','system:output':'U','system:control':'C','persona:autonomy':'A','persona:belonging':'B','persona:purpose':'P'};
const HIDDEN=0,BLUR=1,CLEAR=2,ENERGY_CAP=BALANCE_HOLD;
class Lens { // GridLens (NodeSimV3+)
  constructor(){this.energy=0;this.out_streak=0;this.levels={system:{order:0,output:0,control:0},persona:{autonomy:0,belonging:0,purpose:0}};}
  level(t,fr){return this.levels[t][fr];}
  can_focus(t,fr){return this.energy>=1&&!!FRAGMENTS[t]&&FRAGMENTS[t].includes(fr)&&this.levels[t][fr]<CLEAR;}
  focus(t,fr){if(!this.can_focus(t,fr))return false;this.energy-=1;this.levels[t][fr]+=1;return true;}
  end_beat(g){if(Grid.inBand(g)){this.energy=Math.min(this.energy+1,ENERGY_CAP);this.out_streak=0;}else{this.out_streak++;if(this.out_streak%2===0)this.energy=Math.trunc(this.energy/2);}}
  enough(t){let c=0,s=0;for(const fr of FRAGMENTS[t]){if(this.levels[t][fr]===CLEAR)c++;if(this.levels[t][fr]>=BLUR)s++;}return c>=2||s===3;}
  both_enough(){return this.enough('system')&&this.enough('persona');}
  disclosed(t){let n=0;for(const fr of FRAGMENTS[t])n+=this.levels[t][fr];return n;}
  static view(l,v){if(l===BLUR)return v<0.34?'low':(v<0.67?'mid':'high');if(l===CLEAR)return v.toFixed(2);return '?';}
  static code_of(t,fr){return CODES[t+':'+fr]||'-';}
  static from_code(ch){for(const k in CODES)if(CODES[k]===ch)return k.split(':');return [];}
}
const M_EMPTY=0,M_T=1,M_A=2,M_S=3;
class MicroGrid {
  constructor(){this.state=new Array(100).fill(0);this.tag=new Array(100).fill('');}
  update(grip,reg){const st=this.state,tg=this.tag,base=Grid.cell(grip)*5;let placed=false;
    for(let k=0;k<5;k++)if(st[base+k]===M_EMPTY){st[base+k]=M_T;tg[base+k]=reg;placed=true;break;}
    if(!placed){const want=reg==='care'?M_A:(reg==='resistance'?M_S:-1);
      for(let k=0;k<5;k++)if(st[base+k]===want){st[base+k]=reg==='care'?M_S:M_A;break;}}
    let dogma=true;for(let k=0;k<5;k++)if(st[base+k]!==M_T||tg[base+k]!==tg[base]){dogma=false;break;}
    if(dogma)st[base+4]=M_A;
    const snap=st.slice(),stag=tg.slice();
    for(let k=0;k<5;k++){const j=base+k;const nb=[];if(k>0)nb.push(j-1);if(k<4)nb.push(j+1);
      if(snap[j]===M_T){for(const n of nb)if((snap[n]===M_T&&stag[n]!==stag[j])||snap[n]===M_A){st[j]=M_A;break;}}
      else if(snap[j]===M_A&&reg==='care'){for(const n of nb)if(snap[n]===M_A||snap[n]===M_S){st[j]=M_S;break;}}}}
  count_in_band(s){let n=0;for(const c of [9,10])for(let k=0;k<5;k++)if(this.state[c*5+k]===s)n++;return n;}
  unresolved(g){const b=Grid.cell(g)*5;let a=0,s=0;for(let k=0;k<5;k++){if(this.state[b+k]===M_A)a++;if(this.state[b+k]===M_S)s++;}return a>s;}
}
const f3=v=>v.toFixed(3);
class Sim { // NodeSimV4, inheritance chain flattened in call order
  constructor(seed,maxBeats,commands){
    this.rng=new PCG(seed);this.seed=seed;this.max_beats=maxBeats||60;this.commands=commands;
    this.beat=0;this.dominance=0;this.opinion=0;
    this.persona={autonomy:0.5,belonging:0.5,purpose:0.5};this.system_obj={order:0.5,output:0.5,control:0.5};
    this.balance_streak=0;this.ended=false;this.outcome='';this.events=[];this.trace=[];this.pending_cmd=null;this.pending_idx=-1;
    this.counts={obey:0,negotiate:0,defy:0};this.system_chooser=null;this.persona_chooser=null;this.audience_chooser=null;
    for(const k in this.system_obj)this.system_obj[k]=this.rng.range(0.2,0.9);
    this.lens=new Lens();this.lens_chooser=null;this._lens_event='';
    this.warn=0.5;this.cond_kind='';this.allowed=[];this.cond_history={};this.synthesis_type='';
    this.registers={command:0,care:0,resistance:0};this.engine_registers={command:0,care:0,resistance:0};this.node_registers={command:0,care:0};
    this.aim_history={};this.next_is_aim=false;this.grid_streak=0;this.micro=new MicroGrid();this.micro_need=2;this.use_m4=true;
  }
  run(){while(!this.ended)this.step();return this;}
  step(){if(this.ended)return;this.begin_beat();this.finish_beat();}
  begin_beat(idx=-1){ if(this.cond_kind==='sys'&&idx>=0&&!this.allowed.includes(idx))idx=this.allowed[0]; return this._lens_begin(idx);}
  _lens_begin(idx){this._lens_event='';const pick=this.lens_chooser?this.lens_chooser(this):this.ai_lens_pick();
    if(pick.length===2&&this.lens.focus(pick[0],pick[1])){this._lens_event=`lens=${pick[0]}:${pick[1]}:${this.lens.level(pick[0],pick[1])}`;
      const saved=this.audience_chooser;this.audience_chooser=()=>0.0;const c=this._dia_begin(idx);this.audience_chooser=saved;return c;}
    return this._dia_begin(idx);}
  _dia_begin(idx){this.beat++;const delta=this.audience_chooser?this.audience_chooser(this):this.rng.range(-0.2,0.2);
    this.opinion=clamp(this.opinion+delta,-1,1);if(idx<0)idx=this.system_chooser?this.system_chooser(this):this._ai_system_pick();
    this.pending_idx=idx;this.pending_cmd=this.commands[idx];return this.pending_cmd;}
  finish_beat(response=''){const before=this.dominance;this._v3_finish(response);const t=this.trace[this.trace.length-1];
    const reg={obey:'command',negotiate:'care',defy:'resistance'}[t.response];this.micro.update(this.dominance,reg);
    t.micro_s_band=this.micro.count_in_band(M_S);
    if(this.ended&&this.outcome==='synthesis'&&t.micro_s_band<this.micro_need){this.synthesis_type='';
      if(this.beat>=this.max_beats){this.outcome='no_synthesis';return;}this.ended=false;this.outcome='';this._next_condition(before);}
    if(this.use_m4&&!this.ended&&this.cond_kind==='sys'){const calm=this.allowed.filter(i=>!this.micro.unresolved(this.expected_grip(this.commands[i])));if(calm.length)this.allowed=calm;}}
  _v3_finish(response){const before=this.dominance;this._v2_finish(response);
    this.grid_streak=Grid.inBand(this.dominance)?this.grid_streak+1:0;this.trace[this.trace.length-1].cell=Grid.cell(this.dominance);
    if(this.ended&&this.outcome==='synthesis'&&this.grid_streak<BALANCE_HOLD){this.synthesis_type='';
      if(this.beat>=this.max_beats){this.outcome='no_synthesis';return;}this.ended=false;this.outcome='';this._next_condition(before);return;}

function header(c,title,sub){c.append(el('h1','title',title));if(sub)c.append(el('p','subtitle',sub));}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s-])\w/g,m=>m.toUpperCase());}
function menuItem(title,desc,cb,id){const b=el('button','menu-item',null,{type:'button','data-id':id,on:{click:cb}});b.append(el('span','mi-title',title),el('span','mi-desc',desc),el('span','mi-arrow','→',{'aria-hidden':'true'}));return b;}
function showMenu(){S.inAuto=false;const c=screen();header(c,'Subjugated Dialectics','Choose the era of the dilemma');const list=el('div','menu');c.append(list);
  list.append(menuItem('Auto mode','The AI plays every seat, run after run. Take the Audience seat any time.',autoStart,'auto'));
  for(const id of MENU_ORDER){const e=eraOf(id);list.append(menuItem(titleCase(e.title),e.blurb,()=>{S.era=id;showRole();},id));}
  list.append(menuItem('Gallery',`${Gallery.entries.length} syntheses reached in auto mode`,()=>showGallery(false),'gallery'));}
function showRole(){const c=screen();header(c,titleCase(eraOf(S.era).title),'Choose your seat');const list=el('div','menu');c.append(list);
  list.append(menuItem('Audience','Watch, and press with public opinion. You also hold the Lens.',()=>startRole('audience'),'audience'));
  list.append(menuItem('Persona','Answer each order: obey, negotiate, or defy.',()=>startRole('persona'),'persona'));
  list.append(menuItem('System','Issue the orders. The Persona will answer.',()=>startRole('system'),'system'));
  c.append(btn('← Back',showMenu,'btn ghost'));}
function wireAudience(sim){sim.audience_chooser=()=>S.pendingAudience;sim.lens_chooser=()=>{const p=S.pendingLens;S.pendingLens=[];return p;};}
function startRole(r){S.role=r;S.sim=new Sim(Math.floor(Math.random()*2147483647),60,eraOf(S.era).commands);S.pendingAudience=0;S.pendingLens=[];if(r==='audience')wireAudience(S.sim);showPlay();}
let P={};
function showPlay(){const c=screen();c.classList.add('play');P={};
  if(S.inAuto)c.append(autoBar());
  P.beat=el('div','crumb');c.append(P.beat);
  const cmd=el('section','order');P.cmdTitle=el('h2','order-title');P.cmdText=el('p','order-text');P.cmdNote=el('p','order-note');cmd.append(P.cmdTitle,P.cmdText,P.cmdNote);c.append(cmd);
  const gm=el('section','meter');const gl=el('div','meter-label');
  P.gripVal=el('span','ml-val');gl.append(el('span','ml-end','← Persona'),el('span','ml-name','System grip ⓘ',{tip:'SYSTEM GRIP — grid of 20 cells × 5%. Balance band 45–55%. Warning lines at 25% / 75%. The strip below shows micro-nodes: pale T = thesis, rust A = antithesis, amber S = synthesis.'}),P.gripVal,el('span','ml-end r','System →'));gm.append(gl);
  const bar=el('div','bar grip');P.gripFill=el('div','fill');bar.append(P.gripFill);bar.append(el('div','band',null,{title:'Balance band 45–55%'}));
  for(let i=1;i<20;i++){const t=el('div','tick');t.style.left=(i*5)+'%';bar.append(t);}for(const p of [25,75]){const w=el('div','warn');w.style.left=p+'%';bar.append(w);}bar.append(el('div','centre'));
  gm.append(bar);P.micro=el('canvas','micro',null,{title:'Micro-nodes (5 per cell): pale = thesis, rust = antithesis, amber = synthesis. Synthesis needs 2+ amber marks in the two middle cells.'});gm.append(P.micro);
  const ol=el('div','meter-label');P.pubVal=el('span','ml-val');ol.append(el('span','ml-end','← System'),el('span','ml-name','Public opinion ⓘ',{tip:'PUBLIC OPINION (toward Persona). Positive values pull grip toward the Persona each beat.'}),P.pubVal,el('span','ml-end r','Persona →'));
  const pb=el('div','bar pub');P.pubFill=el('div','fill');pb.append(P.pubFill,el('div','centre'));gm.append(ol,pb);c.append(gm);
  P.chips=el('div','chips');c.append(P.chips);P.lens=el('section','lens');c.append(P.lens);
  P.actions=el('div','actions');c.append(P.actions);
  const lg=el('section','logwrap');lg.append(el('div','log-head','Move log'));P.log=el('ol','log',null,{'aria-live':'polite'});lg.append(P.log);c.append(lg);
  const foot=el('div','foot');foot.append(btn('Auto-finish',autoFinish,'btn ghost','AUTO-FINISH — the scripted AI plays the rest of the run'));if(!S.inAuto)foot.append(btn('Quit to menu',showMenu,'btn ghost'));c.append(foot);
  refresh();nextBeat();}
function setActions(nodes){P.actions.replaceChildren(...nodes);}
function lockActions(){for(const b of P.actions.querySelectorAll('button'))b.disabled=true;}
function nextBeat(){const sim=S.sim;if(!P.actions||!P.actions.isConnected)return;if(sim.ended){showResult();return;}
  if(S.inAuto&&S.role==='auto'){const cmd=sim.begin_beat();showCommand(cmd);sim.finish_beat();afterBeat();setActions([el('div','act-note','The AI holds every seat this run.')]);S.timer=setTimeout(nextBeat,AUTO_BEAT);return;}
  if(S.role==='audience'){const cmd=sim.begin_beat();showCommand(cmd);sim.finish_beat();afterBeat();audienceButtons();S.timer=setTimeout(nextBeat,BEAT_DELAY);return;}
  if(S.role==='persona'){const cmd=sim.begin_beat();showCommand(cmd);const inv=sim.cond_kind==='invite';
    if(inv)P.cmdNote.textContent='The Node invites you to negotiate. Accept with Negotiate, or refuse with Obey / Defy.';
    setActions([btn('Obey',()=>persona('obey'),'btn act obey','OBEY — comply. Grip moves toward the System.'),btn(inv?'Negotiate (accept Node)':'Negotiate',()=>persona('negotiate'),'btn act negotiate','NEGOTIATE — pull grip a quarter of the way back to the centre.'),btn('Defy',()=>persona('defy'),'btn act defy','DEFY — resist. Grip moves toward the Persona; the System tightens control.')]);return;}
  P.cmdTitle.textContent='Waiting for your order';P.cmdText.textContent='Pick a command. The Persona will answer.';
  P.cmdNote.textContent=sim.cond_kind==='sys'?'Node condition: only orders that pull grip back toward balance are open.':sim.cond_kind==='invite'?'The Node has invited the Persona to negotiate this beat.':'';
  P.beat.textContent=`${eraOf(S.era).title} · SYSTEM · BEAT ${sim.beat+1}`;
  setActions(sim.commands.map((c,i)=>{const b=btn(c.name,()=>sysOrder(i),'btn act order',c.text);if(sim.cond_kind==='sys'&&!sim.allowed.includes(i)){b.disabled=true;b.title='Node: this order pushes grip away from balance';b.classList.add('closed');}return b;}));}
function persona(r){lockActions();S.sim.finish_beat(r);afterBeat();S.timer=setTimeout(nextBeat,BEAT_DELAY);}
function sysOrder(i){lockActions();const cmd=S.sim.begin_beat(i);showCommand(cmd);S.sim.finish_beat();afterBeat();S.timer=setTimeout(nextBeat,BEAT_DELAY);}
function audienceButtons(){const opts=[['Favor System',-0.2],['Stay neutral',0],['Favor Persona',0.2]];
  setActions(opts.map(([l,v])=>{const on=S.pendingAudience===v;const b=btn(l,()=>{S.pendingAudience=v;audienceButtons();},'btn act toggle'+(on?' on':''),`Public pressure applied every beat until you change it (${v>0?'+':''}${v.toFixed(1)} opinion per beat)`);b.setAttribute('aria-pressed',on);return b;}));}
function autoFinish(){clearTimers();while(!S.sim.ended)S.sim.step();showResult();}
function showCommand(cmd){P.beat.textContent=`${eraOf(S.era).title} · ${S.role.toUpperCase()} · BEAT ${S.sim.beat}`;P.cmdTitle.textContent=cmd.name;P.cmdText.textContent=cmd.text;P.cmdNote.textContent='';}
const signed=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2);
function afterBeat(){const t=S.sim.trace[S.sim.trace.length-1];const li=el('li','ev '+t.response);
  li.append(el('span','ev-n',String(t.beat).padStart(2,'0')),el('span','ev-cmd',t.cmd),el('span','ev-arrow','→'),el('span','ev-r',t.response.toUpperCase()),el('span','ev-g',`grip ${Math.round(Grid.gauge(t.d))}%`),el('span','ev-o',`public ${signed(t.o)}`));
  const ev=t.lens||'';if(ev){const b=ev.replace(/^lens=/,'').split(':');li.append(el('span','ev-tag t-lens',`Lens → ${b[0]} ${b[1]} (${['hidden','blur','clear'][+b[2]]})`));}
  const nev=t.node||'',aim=nev.endsWith('|aim')?' (aim)':'';if(nev.startsWith('node=sys'))li.append(el('span','ev-tag t-node','Node: orders restricted'+aim));else if(nev)li.append(el('span','ev-tag t-node','Node: invitation '+nev.replace(/\|aim$/,'').split(':')[1]+aim));
  P.log.append(li);P.log.scrollTop=P.log.scrollHeight;refresh();}
function refresh(){const sim=S.sim,g=(sim.dominance+1)*50,o=(sim.opinion+1)*50;P.gripFill.style.width=g+'%';P.gripVal.textContent=Math.round(g)+'%';P.gripFill.parentElement.classList.toggle('inband',Grid.inBand(sim.dominance));
  P.pubFill.style.left=Math.min(50,o)+'%';P.pubFill.style.width=Math.abs(o-50)+'%';P.pubVal.textContent=signed(sim.opinion);drawMicro();refreshLens();}
function drawMicro(){const cv=P.micro,dpr=window.devicePixelRatio||1,W=cv.clientWidth||600,H=cv.clientHeight||8;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  g.fillStyle='rgba(224,160,48,0.12)';g.fillRect(W*0.45,0,W*0.10,H);const w=W/100,col=[null,'rgba(217,209,196,.75)','#d94d2e','#ffbf40'];for(let j=0;j<100;j++){const s=S.sim.micro.state[j];if(!s)continue;g.fillStyle=col[s];g.fillRect(j*w+0.5,0,Math.max(1,w-1),H);}}
function chip(label,value,tip,state){const c=el('div','chip'+(state?' '+state:''),null,{tip});c.append(el('span','chip-l',label),el('span','chip-v',value));return c;}
function refreshLens(){const sim=S.sim,l=sim.lens;const held=Math.min(sim.grid_streak,4),ms=sim.micro.count_in_band(M_S);
  const chips=[chip('Balance held',`${held} / 4`,'NODE GATE ① — beats in a row with grip inside the 45–55% band (need 4).',held>=4?'ok':''),
    chip('Synthesis marks',`${ms} / ${MICRO_NEED}`,'MICRO S IN BAND — amber synthesis micro-nodes in the two middle cells (need 2).',ms>=MICRO_NEED?'ok':''),
    chip('Seen of System',l.enough('system')?'enough':'not yet',`NODE GATE ② DISCLOSURE — System revealed through the Lens: ${l.disclosed('system')}/6 (enough = 2 clear, or all 3 at least blurred).`,l.enough('system')?'ok':''),
    chip('Seen of Persona',l.enough('persona')?'enough':'not yet',`NODE GATE ② DISCLOSURE — Persona revealed: ${l.disclosed('persona')}/6.`,l.enough('persona')?'ok':''),
    chip('Lens energy',`${l.energy} / 4`,'LENS ENERGY — +1 for each beat in the band; halves after every 2 beats outside it. 1 energy sharpens one hidden value.','')];
  chips.push(sim.cond_kind?chip('Node next',(sim.cond_kind==='sys'?'restricts orders':'invites Persona')+(sim.next_is_aim?' (aiming for balance)':''),'NODE NEXT — next beat the Node either closes orders that push grip away from balance, or invites the Persona to negotiate.','warn'):chip('Node next','—','NODE NEXT — the Node will not intervene next beat.',''));
  P.chips.replaceChildren(...chips);
  const audienceView=S.role==='audience'||S.role==='auto';P.lens.replaceChildren();
  if(audienceView){P.lens.append(el('div','lens-head',S.role==='auto'?'The Lens (held by the AI this run)':'The Lens — spend 1 energy to sharpen one hidden value (applies next beat)'));
    for(const target of ['system','persona']){const row=el('div','lens-row');row.append(el('span','lens-t',titleCase(target)));
      for(const f of FRAGMENTS[target]){const lv=l.level(target,f),on=S.pendingLens[0]===target&&S.pendingLens[1]===f;
        const b=btn(`${titleCase(f)} · ${['hidden','blur','clear'][lv]}`,()=>{S.pendingLens=on?[]:[target,f];refreshLens();},'btn lens-b lv'+lv+(on?' on':''),`${target}.${f}: ${['hidden','blurred','clear'][lv]}`);
        b.disabled=S.role==='auto'||(!l.can_focus(target,f)&&!on);b.setAttribute('aria-pressed',on);row.append(b);}P.lens.append(row);}}
  else{const other=S.role==='persona'?'system':'persona',vals=other==='system'?sim.system_obj:sim.persona;const row=el('div','seen');
    row.append(el('span','lens-t',`What you see of the ${titleCase(other)} ⓘ`,{tip:"Seen through the Audience's Lens: ? = hidden, low/mid/high = blurred, a number = clear."}));
    for(const f of FRAGMENTS[other]){const lv=l.level(other,f);row.append(el('span','seen-v lv'+lv,`${titleCase(f)} ${Lens.view(lv,vals[f])}`));}P.lens.append(row);}}
function sec(title,body,cls){const s=el('section','rsec'+(cls?' '+cls:''));if(title)s.append(el('h3','rsec-h',title));const add=b=>s.append(typeof b==='string'?el('p',null,b):b);if(Array.isArray(body))body.forEach(add);else if(body!=null)add(body);return s;}
function resultLayout(c,sim,title,live){const grid=el('div','result');const left=el('div','r-art');left.append(artCanvas(sim.trace,sim.outcome==='synthesis',live));
  const lg=el('div','legend');for(const [k,n] of [['obey','Obey'],['negotiate','Negotiate'],['defy','Defy']])lg.append(el('span','lg '+k,n));left.append(lg);
  const right=el('div','r-text');grid.append(left,right);c.append(el('h1','title r',title),grid);return right;}
function shareRow(col,code){if(!code)return;const r=el('div','row');r.append(btn('Copy viewer link',e=>copy(VIEWER_URL+'#'+code,e.target),'btn','OPEN IN VIEWER — copies the viewer link for this run (this page makes no network calls)'),btn('Copy code',e=>copy(code,e.target),'btn'));
  col.append(sec('Replay code',[el('code','code',code),el('p','muted','Anyone can rebuild and verify this run in the viewer.'),r]));}
function extractBtn(sim,era,role,code){return btn('Copy export (JSON)',e=>copy(JSON.stringify({format:'sd-play-export/1',era,role,code,outcome:sim.outcome,beats:sim.beat,hash:sim.log_hash(),synthesis_type:sim.synthesis_type,rarity:rarity(sim),trace:sim.trace},null,2),e.target),'btn','EXTRACT FROM NODE — this offline page copies the run data as JSON instead of writing the QR / NFT package.');}
function verdictBlock(ins,sim){return sec(null,[el('p','verdict '+(sim.outcome==='synthesis'?'yes':'no'),ins.verdict),...ins.stats.map(s=>el('p','stat',s)),el('p','closing',ins.closing)]);}
function showResult(){if(S.inAuto){autoResult();return;}clearTimers();const sim=S.sim,ins=insight(sim,S.era);const c=screen();c.classList.add('wide');
  const col=resultLayout(c,sim,`Insight — ${titleCase(eraOf(S.era).title)}`,true);
  col.append(verdictBlock(ins,sim),sec(null,ins.dilemma,'dilemma'));
  const l=sim.lens;col.append(sec('Disclosure',`Lens v0.1 · System ${l.disclosed('system')}/6 ${l.enough('system')?'enough':'not enough'} · Persona ${l.disclosed('persona')}/6 ${l.enough('persona')?'enough':'not enough'}`));
  col.append(sec('Gendered reading',gender(sim),'gender'));
  const ip=imagePrompt(sim,S.era);const pr=el('div','row');pr.append(btn('Copy image prompt',e=>copy(ip,e.target),'btn'),btn('Copy Grok link',e=>copy(GROK_WEB_URL,e.target),'btn','OPEN GROK — copies grok.com; paste the prompt into Grok Imagine with your own account'));
  col.append(sec('Image prompt',[el('p','muted',ip),pr]));
  const code=encode(sim,S.era,S.role);shareRow(col,code);
  col.append(sim.outcome==='synthesis'?sec(null,extractBtn(sim,S.era,S.role,code)):el('p','muted','No synthesis — nothing to extract from the Node.'));
  col.append(el('p','muted small','Scripted insight · offline page, no AI call.'),btn('Again',showMenu,'btn primary'));}
function hashSeed(a,b){const r=new SD.PCG(BigInt(a)*1000003n+BigInt(b));return r.next()&2147483647;}
function autoStart(){S.inAuto=true;if(!S.runner)S.runner={session:Math.floor(Math.random()*2**31),index:-1};autoNext();}
function autoStop(){S.inAuto=false;showMenu();}
function autoNext(){clearTimers();if(!S.inAuto)return;const R=S.runner;R.index++;const era=ERA_ORDER[R.index%3];S.runInfo={index:R.index,era};S.era=era;S.role=S.humanSeat?'audience':'auto';
  S.sim=new Sim(hashSeed(R.session,R.index),60,eraOf(era).commands);S.pendingAudience=0;S.pendingLens=[];if(S.role==='audience')wireAudience(S.sim);showPlay();}
function autoBar(){const bar=el('div','autobar');bar.append(el('span','ab-s',`Auto · run #${S.runInfo.index+1} · ${eraOf(S.era).title} · Audience: ${S.role==='audience'?'you':'AI'} · Gallery ${Gallery.entries.length}`));
  const seat=btn('',()=>{S.humanSeat=!S.humanSeat;st();},'btn small');const st=()=>{seat.textContent=S.humanSeat?('Leave the seat'+(S.role==='audience'?'':' (you hold it from the next run)')):('Take the Audience seat'+(S.role==='audience'?' (AI takes it from the next run)':' (from the next run)'));};st();
  bar.append(seat,btn('Gallery',()=>showGallery(true),'btn small'),btn('Exit auto',autoStop,'btn small'));return bar;}
function autoResult(){clearTimers();const sim=S.sim;const role=S.role==='auto'?'persona':S.role;let entry=null;
  if(sim.outcome==='synthesis'){const code=encode(sim,S.era,role);if(code){const r=rarity(sim);entry={code,hash:sim.log_hash(),era:S.era,title:eraOf(S.era).title,seat:S.role,beats:sim.beat,type:sim.synthesis_type,rarity:r.tier,rarity_reason:r.reason,at:new Date().toISOString().slice(0,19)};}}
  const added=entry?Gallery.add(entry):false;pieceScreen(sim,entry,added?'Added to the gallery':(entry?'Already in the gallery':'No synthesis — nothing for the gallery'),true);S.pause=setTimeout(autoNext,AUTO_PAUSE);}
function pieceScreen(sim,e,note,live){const c=screen();c.classList.add('wide');if(live)c.append(autoBar());const ins=insight(sim,S.era);
  const col=resultLayout(c,sim,`${titleCase(eraOf(S.era).title)} — ${sim.outcome==='synthesis'?'Synthesis':'No synthesis'}`,live);
  col.append(verdictBlock(ins,sim),sec(null,ins.dilemma,'dilemma'));
  if(e){const r=rarity(sim);const rc=el('div','rarity');rc.append(el('span','tier '+r.tier.toLowerCase(),r.tier),el('span',null,`${r.reason?r.reason+' · ':''}${sim.synthesis_type.toUpperCase()} synthesis · ${e.beats} beats · audience: ${e.seat==='audience'?'human':'AI'}`));col.append(sec('Rarity R1.0',rc));}
  const nt=el('p','note',note);col.append(nt);shareRow(col,e?e.code:encode(sim,S.era,S.role==='auto'?'persona':S.role));
  const row=el('div','row');if(sim.outcome==='synthesis')row.append(extractBtn(sim,S.era,S.role,e&&e.code));
  if(live)row.append(btn('Stay on this piece',()=>{clearTimeout(S.pause);nt.textContent=note+' · paused — press Next run to continue';},'btn'),btn('Next run',autoNext,'btn primary'));else row.append(btn('← Gallery',()=>showGallery(false),'btn'));col.append(row);}
function showGallery(fromAuto){S.inAuto=false;const c=screen();c.classList.add('wide');const fmt=o=>Object.entries(o).map(([k,v])=>`${k} ${v}`).join(', ')||'none';
  header(c,`Gallery — ${Gallery.entries.length} syntheses`,`By rarity: ${fmt(Gallery.countBy('rarity'))} · by era: ${fmt(Gallery.countBy('title'))} · newest first · codes are rebuilt when shown`);
  const g=el('div','gallery');c.append(g);let shown=0;for(let i=Gallery.entries.length-1;i>=0&&shown<36;i--,shown++){const e=Gallery.entries[i],r=decode(e.code),cell=el('div','g-cell');
    if(r.ok){cell.append(artCanvas(r.sim.trace,true,false,'thumb'),btn(`${titleCase(e.title)} · ${e.rarity}`,()=>{S.sim=r.sim;S.era=r.era;S.role=r.role;pieceScreen(r.sim,e,`Rebuilt from its code · log hash ${r.hash.slice(0,16)}…`,false);},'btn small'));}
    else cell.append(el('p','muted',`${e.title} — cannot rebuild: ${r.reason}`));g.append(cell);}
  if(!Gallery.entries.length)g.append(el('p','muted','No syntheses yet. Run Auto mode to collect some.'));
  const row=el('div','row');if(fromAuto)row.append(btn('← Back to auto (new run)',autoStart,'btn'));row.append(btn('Menu',showMenu,'btn'));c.append(row);}
window.addEventListener('resize',()=>{if(P.micro&&P.micro.isConnected)drawMicro();});
window.SDApp={showMenu,state:S,decode,encode,insight};
showMenu();
})();
</script>
